name: Bug report
description: Report something that does not work as documented.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Do not report security vulnerabilities here; see [SECURITY.md](https://github.com/krax1337/notation-aws-verifier/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem, including error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal Kyverno policy, TrustPolicy/TrustStore, and image reference that reproduce the issue (redact account IDs if needed).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: notation-aws-verifier version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: chart-version
    attributes:
      label: Helm chart version
      placeholder: 1.0.0
  - type: input
    id: kyverno-version
    attributes:
      label: Kyverno version
      placeholder: v1.15.0
  - type: input
    id: kubernetes-version
    attributes:
      label: Kubernetes version and distribution
      placeholder: EKS 1.34
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Verifier logs (ideally with `--logLevel=debug`). This field is rendered as code.
      render: shell

subjects:
  - kind: ServiceAccount
    name: notation-aws-verifier
    namespace: notation-aws-verifier

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notation-aws-verifier-role
  namespace: notation-aws-verifier
  labels:
    app.kubernetes.io/instance: notation-aws-verifier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: notation-aws-verifier
    app.kubernetes.io/part-of: notation-aws-verifier
    app.kubernetes.io/version: v1.0.0
    helm.sh/chart: notation-aws-verifier-1.0.0
rules:
  # Self-signed CA and TLS pair secrets (created, rotated and served by the service),
  # plus registry credentials referenced by --imagePullSecrets.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  # Notation plugin configuration (--pluginConfigMap).
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  # Leader election for certificate rotation.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch


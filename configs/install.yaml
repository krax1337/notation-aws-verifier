---
apiVersion: v1
kind: Service
metadata:
  name: notation-aws-verifier-svc
  namespace: notation-aws-verifier
  labels:
    app.kubernetes.io/instance: notation-aws-verifier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: notation-aws-verifier
    app.kubernetes.io/part-of: notation-aws-verifier
    app.kubernetes.io/version: v1.0.0
    helm.sh/chart: notation-aws-verifier-1.0.0
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
    - name: probes
      port: 8081
      protocol: TCP
      targetPort: probes
  selector:
    app.kubernetes.io/name: notation-aws-verifier
    app.kubernetes.io/instance: notation-aws-verifier

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notation-aws-verifier
  namespace: notation-aws-verifier
  labels:
    app.kubernetes.io/instance: notation-aws-verifier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: notation-aws-verifier
    app.kubernetes.io/part-of: notation-aws-verifier
    app.kubernetes.io/version: v1.0.0
    helm.sh/chart: notation-aws-verifier-1.0.0
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: notation-aws-verifier
      app.kubernetes.io/instance: notation-aws-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: notation-aws-verifier
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: notation-aws-verifier
        app.kubernetes.io/part-of: notation-aws-verifier
        app.kubernetes.io/version: v1.0.0
        helm.sh/chart: notation-aws-verifier-1.0.0
    spec:
      serviceAccountName: notation-aws-verifier
      terminationGracePeriodSeconds: 10
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notation-aws-verifier
          image: "ghcr.io/krax1337/notation-aws-verifier:v1.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - --logLevel=info
            - --logFormat=text
            - --cacheEnabled=true
            - --cacheMaxSize=2000
            - --cacheTTLDurationSeconds=7200
            - --reviewKyvernoToken=true
            - --allowedUsers=system:serviceaccount:kyverno:kyverno-admission-controller,system:serviceaccount:kyverno:kyverno-reports-controller
            - --pluginConfigMap=notation-plugin-config
            - --allowInsecureRegistry=false
            - --maxSignatureAttempts=30
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
            - name: http
              containerPort: 9080
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          env:
            - name: NOTATION_DIR
              value: /notation
            - name: AWS_ECR_CACHE_DIR
              value: /tmp/.ecr
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_NAME
              value: notation-aws-verifier-svc
            - name: DEPLOYMENT_NAME
              value: notation-aws-verifier
            - name: AWS_REGION
              value: "us-west-2"
            - name: DEFAULT_TRUST_POLICY
              value: "aws-signer-trust-policy"
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 20
            httpGet:
              path: /readyz
              port: probes
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 6
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: probes
              scheme: HTTP
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /readyz
              port: probes
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: notation
              mountPath: /notation
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: notation
          emptyDir: {}
        - name: tmp
          emptyDir: {}

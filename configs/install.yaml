---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: notation-aws-verifier-clusterrole
  labels:
    app.kubernetes.io/instance: notation-aws-verifier
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: notation-aws-verifier
    app.kubernetes.io/part-of: notation-aws-verifier
    app.kubernetes.io/version: v1.0.0
    helm.sh/chart: notation-aws-verifier-1.0.0
rules:
  # TrustPolicy/TrustStore reconcilers: watch the CRs and add/remove their finalizer.
  - apiGroups:
      - notation.nirmata.io
    resources:
      - trustpolicies
      - truststores
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - notation.nirmata.io
    resources:
      - trustpolicies/finalizers
      - truststores/finalizers
    verbs:
      - update
  # Authenticate callers (--reviewKyvernoToken).
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:

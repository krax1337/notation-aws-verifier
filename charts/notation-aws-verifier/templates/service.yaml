apiVersion: v1
kind: Service
metadata:
  name: {{ template "notation-aws-verifier.serviceName" . }}
  namespace: {{ template "notation-aws-verifier.namespace" . }}
  labels:
    {{- include "notation-aws-verifier.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: https
    - name: probes
      port: 8081
      protocol: TCP
      targetPort: probes
  selector:
    {{- include "notation-aws-verifier.matchLabels" . | nindent 4 }}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "notation-aws-verifier.clusterRoleName" . }}binding
  labels:
    {{- include "notation-aws-verifier.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "notation-aws-verifier.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ template "notation-aws-verifier.serviceAccountName" . }}
    namespace: {{ template "notation-aws-verifier.namespace" . }}

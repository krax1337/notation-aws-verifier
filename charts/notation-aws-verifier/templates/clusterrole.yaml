apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "notation-aws-verifier.clusterRoleName" . }}
  labels:
    {{- include "notation-aws-verifier.labels" . | nindent 4 }}
rules:
  # TrustPolicy/TrustStore reconcilers: watch the CRs and add/remove their finalizer.
  - apiGroups:
      - notation.nirmata.io
    resources:
      - trustpolicies
      - truststores
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - notation.nirmata.io
    resources:
      - trustpolicies/finalizers
      - truststores/finalizers
    verbs:
      - update
  {{- if .Values.tokenReview.enabled }}
  # Authenticate callers (--reviewKyvernoToken).
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  {{- end }}

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: notation-aws-verifier

builds:
  - id: notation-aws-verifier
    main: .
    binary: notation-aws-verifier
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: notation-aws-verifier
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: krax1337
    name: notation-aws-verifier
  prerelease: auto
  footer: |
    ## Container image

    ```
    ghcr.io/krax1337/notation-aws-verifier:{{ .Tag }}
    ```

    ## Helm chart

    ```
    helm install notation-aws-verifier oci://ghcr.io/krax1337/charts/notation-aws-verifier \
      --version {{ .Version }} -n notation-aws-verifier --create-namespace
    ```

    See [SECURITY.md](https://github.com/krax1337/notation-aws-verifier/blob/main/SECURITY.md) to verify signatures and provenance.

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'
      - '^chore\(deps\)!?:'
